<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dextra | Prepared Event Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260525c" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand-mark">
          <h1><a class="brand-link" href="index.html">Dextra</a></h1>
        </div>
        <nav class="top-nav app-nav" aria-label="Signed in primary">
          <a href="index.html#testing">Testing</a>
          <a href="index.html#roleplays">Roleplays</a>
          <a class="active-page" href="index.html#prepared">Prepared Events</a>
          <a href="index.html#leaderboard">Leaderboard</a>
          <a href="index.html#shop">Shop</a>
        </nav>
        <div class="header-actions">
          <a class="profile-link" href="profile.html" aria-label="Open profile">
            <span class="profile-icon" aria-hidden="true"></span>
          </a>
          <button class="button secondary header-auth" id="preparedSignOutButton" type="button">
            Sign Out
          </button>
        </div>
      </header>

      <main class="prepared-review-page">
        <section class="section-heading">
          <p class="eyebrow">Prepared Events</p>
          <h3 id="preparedReviewTitle">Review Upload</h3>
          <p class="roadmap-copy" id="preparedReviewCopy"></p>
        </section>

        <section class="prepared-review-layout">
          <div class="panel upload-panel">
            <input class="hidden" id="preparedFileInput" type="file" />
            <button class="upload-dropzone" id="preparedDropzone" type="button">
              <span class="upload-dropzone-label" id="preparedDropzoneLabel">Drop your file here</span>
              <span class="upload-dropzone-copy" id="preparedDropzoneCopy">
                Drag and drop your file here, or click to browse.
              </span>
              <span class="upload-file-meta" id="preparedFileMeta">No file selected</span>
            </button>
          </div>

          <aside class="panel upload-actions-panel">
            <p class="eyebrow" id="preparedActionEyebrow">Prepared Review</p>
            <h3 id="preparedActionTitle">Check for Errors</h3>
            <p id="preparedActionCopy">
              Upload your file and run a review pass to flag formatting issues, missing sections, and clarity problems.
            </p>
            <button class="button primary review-button" id="preparedCheckButton" type="button">
              Check for Errors
            </button>
            <p class="form-status" id="preparedReviewStatus"></p>
          </aside>
        </section>
      </main>
    </div>

    <script src="reset-seed.js?v=20260524d"></script>
    <script src="feedback-modal.js?v=20260416h"></script>
    <script src="dev-shortcuts.js?v=20260525c"></script>
    <script src="prepared-review.js?v=20260416e"></script>
  </body>
</html>
