<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dextra | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260524c" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand-mark">
          <h1><a class="brand-link" href="index.html">Dextra</a></h1>
        </div>
        <nav class="top-nav" aria-label="Primary">
          <a href="index.html#hero">Home</a>
          <a href="index.html#team">Meet the Team</a>
          <a href="index.html#info">Information</a>
          <a href="index.html#programs">Programs</a>
          <a href="index.html#contact">Contact Us</a>
        </nav>
        <div class="header-actions">
          <a class="button secondary header-auth" href="sign-in.html">Sign In</a>
          <a class="button primary header-auth" href="sign-up.html">Sign Up</a>
        </div>
      </header>

      <main class="auth-page">
        <section class="auth-hero">
          <p class="eyebrow">Member Access</p>
          <h2>Sign in to Dextra</h2>
          <p class="hero-tagline">
            Access your account, practice tools, and chapter resources.
          </p>
        </section>

        <section class="auth-panel standalone-panel">
          <div class="auth-glow"></div>
          <div class="auth-header">
            <p class="eyebrow">Sign In</p>
            <h3>Welcome back</h3>
            <p>Use your email or username and password.</p>
          </div>
          <form class="auth-form" id="signInForm" novalidate>
            <div class="field-row">
              <label for="signInEmail">Email or Username</label>
              <input id="signInEmail" type="text" placeholder="you@school.edu or username" autocomplete="username" required />
            </div>
            <div class="field-row">
              <label for="signInPassword">Password</label>
              <div class="password-field">
                <input id="signInPassword" type="password" placeholder="Enter your password" required />
                <button
                  class="password-toggle"
                  type="button"
                  data-toggle-password="signInPassword"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <span class="eye-icon" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <button class="button primary submit-button" type="submit">Sign In</button>
            <p class="form-status" id="signInStatus" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>

    <script src="reset-seed.js?v=20260415seed"></script>
    <script src="feedback-modal.js?v=20260416h"></script>
    <script src="auth.js?v=20260524c"></script>
  </body>
</html>
